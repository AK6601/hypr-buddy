[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hypr-buddy"
version = "0.1.0"
description = "Desktop companion/mascot for CachyOS + Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "dbus-next>=0.2.3",
    "structlog>=23.1.0",
    "tomli>=2.0.1;python_version<'3.12'",
    "pillow>=10.0.0",
    "cairosvg>=2.7.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["daemon*", "brain*", "ipc*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
