[package]
name = "virtual-buddy-overlay"
version = "0.1.0"
edition = "2021"
description = "Wayland layer-shell overlay renderer for Virtual Buddy"

[dependencies]
# Wayland client bindings — the foundation for all Wayland communication.
wayland-client = "0.31"

# Wayland protocol extensions — wl_shm format constants, etc.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

# wlr-layer-shell protocol for overlay surfaces that float above windows.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Smithay Client Toolkit — higher-level helpers for Wayland clients.
# The "calloop" feature integrates with the calloop event loop.
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }

# PNG image decoding for sprite sheets.
png = "0.17"

# TOML config parsing.
toml = "0.8"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Event loop — epoll-based, integrates with Wayland dispatch.
calloop = "0.14"

# Logging.
log = "0.4"
env_logger = "0.11"

# POSIX APIs (getuid for XDG_RUNTIME_DIR fallback).
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
